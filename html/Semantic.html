<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Learn Semantic Tags</h1>
    <!-- 
    Sematic tags are introduced in HTML 5 in replace of div to increase code readablity
    by the user and the browsers

    Sematic tag means a tag which defines meaning by its name

    all semantic tags are block elements
    -->

    <nav> nav </nav>
    <header> header </header>
    <footer> footer </footer>
    <aside> aside </aside>
    <figure> figure </figure>
    <figcaption> figcaption </figcaption>
    <section> section </section>
    <article> article </article>
    <table> table </table>
    <form> form </form>
    <main> main </main>

    <details> 
        <summary>Web Dev Course</summary>
        
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
        <li>REACT.JS</li>

    </details>

  </body>
</html>
